name: Projection Calibration Backtest

# Manual-only, one-off analysis tool (scripts/backtest_projection_
# calibration.py) - no schedule trigger, never runs unless explicitly
# dispatched. Read-only: does its own temp-DB ingest, never touches the
# deployed app's data or posts anywhere.
on:
  workflow_dispatch: {}

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run projection calibration backtest
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          CURRENT_SEASON: ${{ secrets.CURRENT_SEASON }}
        run: python scripts/backtest_projection_calibration.py
