name: Check Live Combined Score vs Record

# Manual-only, one-off tool (scripts/check_live_combined_score.py) - no
# schedule trigger, never runs unless explicitly dispatched. Read-only,
# no DB ingest needed - just a live ESPN box score lookup.
on:
  workflow_dispatch: {}

jobs:
  check-live-combined-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check live combined score
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          CURRENT_SEASON: ${{ secrets.CURRENT_SEASON }}
        run: python scripts/check_live_combined_score.py
