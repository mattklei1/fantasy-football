name: GroupMe Lineup Alert (Sunday)

# Scheduled trigger disabled 2026-10-10 (user: "i dont want any of the
# other automated messages going out anymore. just the weekly recap") -
# this was also part of why weekly-recap.yml kept firing hours outside
# its own target window and silently self-skipping: GitHub's Actions
# scheduler was throttling this whole repo down to roughly 4 actual
# scheduled executions/day shared across ALL workflows combined,
# regardless of each one's own declared cron cadence - this repo's
# other very-high-frequency crons (keep-app-awake every 15min,
# matchup-snapshot every 10min) were almost certainly crowding out
# everything else, including weekly-recap's narrow Tuesday window.
# workflow_dispatch stays so this can still be run manually on demand.
on:
  workflow_dispatch: {}

jobs:
  post-lineup-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Post Sunday lineup alert
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          CURRENT_SEASON: ${{ secrets.CURRENT_SEASON }}
          GROUPME_PERSONAL_BOT_ID: ${{ secrets.GROUPME_PERSONAL_BOT_ID }}
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: python scripts/post_lineup_alert.py
