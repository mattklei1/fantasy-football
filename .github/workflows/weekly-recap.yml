name: GroupMe Weekly Recap

# Fires several times a day, every day (same pattern as
# playoff-odds-snapshot.yml) rather than targeting one precise Tuesday-
# morning window - GitHub Actions' own cron scheduler turned out to be
# unreliable for this repo (confirmed via real run history, 2026-10-16:
# every single run for a month fired hours outside its declared window
# and self-skipped; keep-app-awake.yml's every-15-minute schedule was
# actually firing about once every 5-7 hours). Fighting that with an
# ever-narrower time window doesn't work - the fix is to stop depending
# on precise timing. scripts/post_weekly_recap.py now self-gates on a
# durable "already posted this week" marker (weekly_recap_tracking.py,
# committed to main) instead of the clock, so it's safe and cheap to
# fire often: most firings are a quick no-op lightweight ESPN check
# before any real ingest work.
on:
  schedule:
    - cron: "10,25,40,55 13,14 * * *"
  workflow_dispatch: {}

# Needed so the auto-provided secrets.GITHUB_TOKEN below can commit the
# "already posted" marker to main (weekly_recap_tracking.py) - same
# no-manually-created-secret pattern as playoff-odds-snapshot.yml's
# write path.
permissions:
  contents: write

jobs:
  post-recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Post weekly recap
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          CURRENT_SEASON: ${{ secrets.CURRENT_SEASON }}
          GROUPME_BOT_ID: ${{ secrets.GROUPME_BOT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Both a read (playoff_odds_snapshots.load_snapshots(), for the
          # PLAYOFF ODDS section's Week-0/last-week comparison - missing
          # entirely before 2026-09-16, which silently fell back to the
          # flat preseason baseline every time) and, as of 2026-10-16, a
          # write (weekly_recap_tracking's "already posted" marker) - the
          # auto-provided Actions token, no manually-created secret needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/post_weekly_recap.py
