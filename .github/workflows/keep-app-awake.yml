name: Keep Streamlit App Awake

# Streamlit Community Cloud puts an idle app to sleep, which then shows
# visitors a "this app has gone to sleep - click to wake it up" screen
# instead of the dashboard (see PROJECT_BRIEF, 2026-09-20: user reported
# having to click that reboot button AND manually re-run "Refresh ESPN
# Data" every single day - the second half was a real bug, fixed
# separately in ui_common.ensure_data_bootstrapped(); this workflow
# addresses the first half, which is Streamlit's own platform behavior
# and can't be fixed from this repo's app code at all).
#
# A plain periodic HTTP request to the app's own public URL is the
# standard workaround - it's enough to register as real traffic and
# reset Streamlit's idle clock, no auth or app code involved. Every 15
# minutes was CHOSEN deliberately frequent on the assumption that a few
# missed GitHub Actions ticks would still leave the app pinged often
# enough to never go idle long enough to sleep - that assumption is now
# disproven (real run history, 2026-10-16): this workflow's declared
# every-15-minutes schedule is actually firing roughly once every 5-7
# hours, not "a few missed ticks" but a near-total miss rate. GitHub's
# Actions scheduler throttles this whole account's total scheduled
# executions well below what any workflow declares, and that isn't
# something fixable from inside this repo's own cron expressions (the
# other, lower-priority scheduled workflows were trimmed the same day
# to reduce competing load, but that's a mitigation, not a guarantee).
#
# The genuinely reliable fix is an external, purpose-built uptime
# pinger that isn't subject to GitHub's own scheduling limits - e.g.
# UptimeRobot's free tier (5-minute interval) or cron-job.org, pointed
# at this same URL. This workflow is kept as a free redundant backup,
# not the primary mechanism.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app to keep it awake
        # --max-time bounds a single hung request; `|| true` means a
        # transient failure (the app genuinely down, a network hiccup)
        # doesn't paint this workflow red every time - the NEXT tick 15
        # minutes later is the real safety net, not this one request.
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" --max-time 30 \
            "https://fantasy-football-home.streamlit.app/" || true
