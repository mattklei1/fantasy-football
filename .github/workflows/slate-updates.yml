name: GroupMe Slate Updates

# Single Sunday send at ~5:00pm Pacific (the 1:30pm early-slate send was
# dropped per user request 2026-09-14 - one consolidated update instead
# of two). Fires several times across a DST-safety window rather than
# once at a fixed UTC time - GitHub Actions cron has no DST awareness,
# and the NFL season crosses the November US DST transition. Each firing
# checks the real Pacific time (fantasy_football/schedule_guard.py) and
# only the one closest to the actual target does anything - see that
# module's docstring for the full reasoning. Minutes are offset from
# :00/:15/:30 on purpose (GitHub recommends not scheduling on the exact
# hour/half-hour, when many workflows across GitHub fire at once).
on:
  schedule:
    # ~5:00pm Pacific Sunday: 00:00 UTC Mon (PDT) / 01:00 UTC Mon (PST)
    - cron: "7,22,37,52 0,1 * * 1"
  workflow_dispatch: {}  # manual "Run workflow" button for testing

jobs:
  post-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Sunday slate update
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          CURRENT_SEASON: ${{ secrets.CURRENT_SEASON }}
          GROUPME_BOT_ID: ${{ secrets.GROUPME_BOT_ID }}
        run: python scripts/post_slate_update.py --label "Sunday Slate Update" --target-hour 17 --target-minute 0
