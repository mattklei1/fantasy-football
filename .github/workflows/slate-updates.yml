name: GroupMe Slate Updates

# Scheduled trigger disabled 2026-10-10 (user: "i dont want any of the
# other automated messages going out anymore. just the weekly recap") -
# see lineup-alert.yml's comment for the full reasoning (this also
# contributed to GitHub's Actions scheduler throttling weekly-recap.yml
# out of its own target window). workflow_dispatch stays so this can
# still be run manually on demand.
on:
  workflow_dispatch: {}  # manual "Run workflow" button for testing

jobs:
  post-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Sunday slate update
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          CURRENT_SEASON: ${{ secrets.CURRENT_SEASON }}
          GROUPME_BOT_ID: ${{ secrets.GROUPME_BOT_ID }}
        run: python scripts/post_slate_update.py --label "Sunday Slate Update" --target-hour 17 --target-minute 0
